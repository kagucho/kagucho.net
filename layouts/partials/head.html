<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ .Title | default .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<meta name="author" content="{{ .Site.Params.author.name }}">
<meta name="robots" content="index,follow">
<meta name="referrer" content="origin-when-cross-origin">

<link rel="apple-touch-icon" sizes="180x180" href="{{ "ico/apple-touch-icon.png" | absURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "ico/favicon-32x32.png" | absURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "ico/favicon-16x16.png" | absURL }}">
<link rel="manifest" href="{{ "ico/site.webmanifest" | absURL }}">
<link rel="mask-icon" href="{{ "ico/safari-pinned-tab.svg" | absURL }}" color="#42DCA3">
<meta name="theme-color" content="#080B0A">

{{ template "_internal/opengraph.html" . }}
{{ partial "twitter_cards.html" . }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">

<link rel="stylesheet" href="{{ "css/site.css" | absURL }}">
